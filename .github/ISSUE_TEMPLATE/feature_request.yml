name: Feature request
description: Suggest a new preset, prop, or plugin option for expo-island-kit.
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, note what is already on the roadmap and deliberately not built yet:
        push-driven updates (requires a paid Apple Developer Program account), App Groups,
        theming and custom animations. IslandKit is **iOS only** — Android support is a
        permanent non-goal.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case, not just the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: What would the TypeScript call or plugin option look like?
      render: typescript
    validations:
      required: true

  - type: checkboxes
    id: presets
    attributes:
      label: Which preset(s) would this affect?
      options:
        - label: Now Playing
        - label: Generic Progress
        - label: Delivery
        - label: Timer
        - label: A new preset
        - label: Config plugin / shared API — not preset-specific

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Including any workaround you're using today.
    validations:
      required: false

  - type: dropdown
    id: contribution
    attributes:
      label: Would you be willing to open a pull request for this?
      description: See CONTRIBUTING.md — happy to help you get started.
      options:
        - "Yes, I'd like to implement it"
        - "Yes, with some guidance"
        - "No, just proposing the idea"
    validations:
      required: true
